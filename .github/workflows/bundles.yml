name: Standards Archive

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  archive:
    name: Build deterministic archive
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and verify deterministic archive
        run: make dist-check

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: coding-standards-archive
          path: |
            dist/coding-standards.tar.gz
            dist/coding-standards.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
