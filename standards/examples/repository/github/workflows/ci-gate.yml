---
# Non-normative reference example; copy through a reviewed local change.
# PR-head ref below is suitable for branch-push test checks. Review mixed
# push/PR event and fork semantics before using as an authoritative gate.
name: CI check gate

# yamllint disable-line rule:truthy
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: read

jobs:
  aggregate:
    name: test-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      checks: read
    steps:
      - name: Wait for observed standardized CI checks
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ github.token }}
          check-regexp: '^(test|e2e|end-to-end|integration|lint|security|build|compat)(-.+)?$'
          running-workflow-name: test-gate
          allowed-conclusions: success
          fail-on-no-checks: 'false'
          wait-interval: '10'
